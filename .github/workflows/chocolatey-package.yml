
name: Build Chocolatey Package

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  package:
    name: Package RemoteApp CLI
    runs-on: windows-latest

    defaults:
      run:
        shell: pwsh

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify Chocolatey
        run: |
          if (-not (Get-Command choco -ErrorAction SilentlyContinue)) {
            throw "Chocolatey CLI is not available on this runner."
          }

          choco --version

      - name: Prepare package files
        run: |
          $ErrorActionPreference = 'Stop'

          $tools = Join-Path $PWD 'chocolatey/tools'
          New-Item -ItemType Directory -Path $tools -Force |
            Out-Null

          $requiredFiles = @(
            'src/remoteapp.ps1',
            'src/remoteapp.cmd',
            'chocolatey/tools/chocolateyInstall.ps1'
          )

          foreach ($file in $requiredFiles) {
            if (-not (Test-Path $file -PathType Leaf)) {
              throw "Required file missing: $file"
            }
          }

          Copy-Item 'src/remoteapp.ps1' "$tools/remoteapp.ps1" -Force
          Copy-Item 'src/remoteapp.cmd' "$tools/remoteapp.cmd" -Force

          Get-ChildItem $tools -File | Select-Object Name, Length

      - name: Determine package version
        id: version
        run: |
          if ($env:GITHUB_REF -match '^refs/tags/v(.+)$') {
            $version = $Matches[1]
          }
          else {
            [xml]$nuspec = Get-Content `
              'chocolatey/remoteapp-cli.nuspec' -Raw

            $node = $nuspec.SelectSingleNode(
              "//*[local-name()='metadata']/*[local-name()='version']"
            )

            if ($null -eq $node -or [string]::IsNullOrWhiteSpace($node.InnerText)) {
              throw "Could not determine package version from nuspec."
            }

            $version = $node.InnerText.Trim()
          }

          if ($version -notmatch '^\d+\.\d+\.\d+(\.\d+)?([+-][0-9A-Za-z.-]+)?$') {
            throw "Invalid package version: $version"
          }

          "value=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Package version: $version"

      - name: Build Chocolatey package
        run: |
          $ErrorActionPreference = 'Stop'

          New-Item -ItemType Directory -Path 'dist' -Force |
            Out-Null

          Push-Location 'chocolatey'
          try {
            choco pack 'remoteapp-cli.nuspec' `
              --version "${{ steps.version.outputs.value }}" `
              --outputdirectory "$env:GITHUB_WORKSPACE/dist"

            if ($LASTEXITCODE -ne 0) {
              throw "choco pack failed with exit code $LASTEXITCODE"
            }
          }
          finally {
            Pop-Location
          }

      - name: Verify package contents
        run: |
          $ErrorActionPreference = 'Stop'

          $packages = @(Get-ChildItem 'dist/*.nupkg' -File)

          if ($packages.Count -ne 1) {
            throw "Expected exactly one .nupkg in dist; found $($packages.Count)."
          }

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [System.IO.Compression.ZipFile]::OpenRead(
            $packages[0].FullName
          )

          try {
            $entries = @($archive.Entries | ForEach-Object {
              $_.FullName.Replace('\', '/').ToLowerInvariant()
            })

            foreach ($required in @(
              'tools/remoteapp.ps1',
              'tools/remoteapp.cmd',
              'tools/chocolateyinstall.ps1'
            )) {
              if ($entries -notcontains $required) {
                throw "Package is missing required entry: $required"
              }

              Write-Host "Verified: $required"
            }
          }
          finally {
            $archive.Dispose()
          }

          Get-ChildItem 'dist' -File | Select-Object Name, Length

      - name: Upload Chocolatey package
        uses: actions/upload-artifact@v4
        with:
          name: remoteapp-chocolatey-${{ steps.version.outputs.value }}
          path: dist/*.nupkg
          if-no-files-found: error
          retention-days: 30


      - name: Publish to Chocolatey Community Repository
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          CHOCO_API_KEY: ${{ secrets.CHOCO_API_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'

          $packages = @(Get-ChildItem 'dist/*.nupkg' -File)

          if ($packages.Count -ne 1) {
            throw "Expected exactly one .nupkg in dist; found $($packages.Count)."
          }

          if ([string]::IsNullOrWhiteSpace($env:CHOCO_API_KEY)) {
            throw "CHOCO_API_KEY secret is not configured."
          }

          choco push $packages[0].FullName `
            --source 'https://push.chocolatey.org/' `
            --api-key $env:CHOCO_API_KEY

          if ($LASTEXITCODE -ne 0) {
            throw "Chocolatey publish failed with exit code $LASTEXITCODE"
          }
